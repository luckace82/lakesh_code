[project]
name = "lakesh"
version = "1.0.0"
description = "Local AI coding assistant powered by Ollama"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Lakesh Contributors"}
]
keywords = [
    "ai",
    "assistant",
    "coding",
    "ollama",
    "local",
    "llm",
    "code-analysis",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Operating System :: OS Independent",
]
dependencies = [
    "ollama>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "rich>=13.0.0",
    "chromadb>=0.4.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "watchdog>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/luckace82/lakesh_code"
Repository = "https://github.com/luckace82/lakesh_code"
Issues = "https://github.com/luckace82/lakesh_code/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
